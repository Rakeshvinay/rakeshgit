databaseChangeLog:
  - changeSet:
      id: create-your-score-progress-table
      author: Brihathi
      changes:
        - createTable:
            tableName: your_score_progress
            columns:
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: subject
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: avg_marks
                  type: INT
              - column:
                  name: date
                  type: DATE
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: your_score_progress
            baseColumnNames: user_id
            constraintName: fk_score_progress_user
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: your_score_progress
            baseColumnNames: tenant_id
            constraintName: fk_score_progress_tenant
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            onDelete: CASCADE
 
 
 