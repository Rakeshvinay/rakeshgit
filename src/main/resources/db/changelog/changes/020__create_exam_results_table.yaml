databaseChangeLog:
  - changeSet:
      id: 200
      author: brihathi
      changes:
        - createTable:
            tableName: exam_results
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: tenant_id
                  type: INTEGER
              - column:
                  name: exam_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: qid
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: answered
                  type: BOOLEAN
              - column:
                  name: visited
                  type: BOOLEAN
              - column:
                  name: marked_for_review
                  type: BOOLEAN
              - column:
                  name: duration
                  type: BIGINT
              - column:
                  name: answer_option
                  type: VARCHAR(250)
              - column:
                  name: marks
                  type: INT
              - column:
                  name: correct_answer_option
                  type: VARCHAR(250)
                  constraints:
                    nullable: true
              - column:
                  name: validate_answer
                  type: VARCHAR(250)
                  constraints:
                    nullable: true
              - column:
                  name: subject
                  type: varchar(32)
                  remarks: Subject name for the question
              - column:
                  name: chapter
                  type: VARCHAR(250)
                  constraints:
                    nullable: true 
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: exam_results
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_exam_results_user
        # - sql:
        #     sql: |
        #       UPDATE exam_results er
        #       SET correct_answer_option = q.correct_answer_option,
        #           validate_answer = CASE 
        #             WHEN er.answer_option IS NULL THEN NULL
        #             WHEN er.answer_option = q.correct_answer_option THEN 'correct'
        #             ELSE 'wrong'
        #           END
        #       FROM questions q
        #       WHERE er.qid = q.qid;
        - addForeignKeyConstraint:
            baseTableName: exam_results
            baseColumnNames: exam_id
            constraintName: fk_exam_results_exam
            referencedTableName: exam
            referencedColumnNames: exam_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: exam__results
            baseColumnNames: tenant_id
            constraintName: fk_exam_results_tenants
            referencedTableName: tenants
            referencedColumnNames: tenant_id
