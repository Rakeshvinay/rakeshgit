databaseChangeLog:
  - changeSet:
      id: 201
      author: brihathi
      changes:
        - createTable:
            tableName: exams
            columns:
              - column:
                  name: exam_id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: tenant_id
                  type: INTEGER
              - column:
                  name: user_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_exam_user
                    references: users(user_id)
              - column:
                  name: subject_id
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: chapter_id
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: exam_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: difficulty
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: grade
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: total_marks
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: total_duration
                  type: BIGINT  
                  constraints:
                    nullable: false
              # - column:
              #     name: start_time
              #     type: TIMESTAMP
              # - column:
              #     name: end_time
              #     type: TIMESTAMP
              - column:
                  name: start_date
                  type: TIMESTAMP
              - column:
                  name: end_date
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP 
        - addForeignKeyConstraint:
            baseTableName: exams
            baseColumnNames: tenant_id
            constraintName: fk_exams_tenants
            referencedTableName: tenants
            referencedColumnNames: tenant_id
