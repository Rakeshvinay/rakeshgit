databaseChangeLog:
  - changeSet:
      id: create-scheduled-chapter-results
      author: brihathi
      changes:
          - createTable:
            tableName: scheduled_chapter_results
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: scheduled_exam_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: edu_scheduled_exam_id
                  type: INTEGER
              - column:
                  name: user_id
                  type: INTEGER
              - column:
                  name: tenant_id
                  type: INTEGER
              - column:
                  name: educator_id
                  type: INTEGER
              - column:
                  name: branch_id
                  type: VARCHAR(250)
              - column:
                  name: batch_id
                  type: VARCHAR(250)
              - column:
                  name: exam_type
                  type: VARCHAR(255)
              - column:
                  name: chapter_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: chapter_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: time_spent
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: percentage
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: marks
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: ai_analysis
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: total_marks
                  type: INTEGER
                  constraints:
                    nullable: false

          - addForeignKeyConstraint:
            baseTableName: scheduled_chapter_results
            baseColumnNames: scheduled_exam_id
            constraintName: fk_scheduled_chapter_results_exam
            referencedTableName: scheduled_exams_
            referencedColumnNames: scheduled_exam_id
          - addForeignKeyConstraint:
            baseTableName: scheduled_chapter_results
            baseColumnNames: edu_scheduled_exam_id
            constraintName: fk_scheduled_chapter_results_exams
            referencedTableName: educator_scheduled_exams
            referencedColumnNames: edu_scheduled_exam_id
          - addForeignKeyConstraint:
            baseTableName: scheduled_chapter_results
            baseColumnNames: tenant_id
            constraintName: fk_scheduled_chapter_results_tenants
            referencedTableName: tenants
            referencedColumnNames: tenant_id
          - addForeignKeyConstraint:
            baseTableName: scheduled_chapter_results
            baseColumnNames: user_id
            constraintName: fk_chapter_results_users
            referencedTableName: users
            referencedColumnNames: user_id
          - addForeignKeyConstraint:
            baseTableName: scheduled_chapter_results
            baseColumnNames: educator_id
            constraintName: fk_scheduled_chapters_results_educators
            referencedTableName: educators
            referencedColumnNames: educator_id
          - addForeignKeyConstraint:
            baseTableName: scheduled_chapter_results
            baseColumnNames: branch_id
            constraintName: fk_chapter_results_braches
            referencedTableName: braches
            referencedColumnNames: branch_id
          - addForeignKeyConstraint:
            baseTableName: scheduled_chapter_results
            baseColumnNames: batch_id
            constraintName: fk_chapters_results_batches
            referencedTableName: batches
            referencedColumnNames: batch_id

  