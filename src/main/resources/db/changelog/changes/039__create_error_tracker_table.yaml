databaseChangeLog:
  - changeSet:
      id: create-error-tracker-table
      author: brihathi
      changes:
        - createTable:
            tableName: error_tracker
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: exam_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT      
              - column:
                  name: qid
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: question_text
                  type: TEXT
              - column:
                  name: answered_option
                  type: VARCHAR(255)
              - column:
                  name: correct_answer_option
                  type: VARCHAR(255)
              - column:
                  name: subject
                  type: VARCHAR(100)
              - column:
                  name: answer_option1
                  type: VARCHAR(255)
              - column:
                  name: answer_option2
                  type: VARCHAR(255)
              - column:
                  name: answer_option3
                  type: VARCHAR(255)
              - column:
                  name: answer_option4
                  type: VARCHAR(255)
              - column:
                  name: brief_explanation
                  type: TEXT