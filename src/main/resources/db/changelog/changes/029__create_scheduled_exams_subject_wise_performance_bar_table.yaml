databaseChangeLog:
  - changeSet:
      id: create-scheduled-exams-subject-wise-performance-bar-table
      author: Brihathi
      changes:
        - createTable:
            tableName: scheduled_exams_subject_wise_performance_bar
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: scheduled_exam_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: edu_scheduled_exam_id
                  type: BIGINT 
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: educator_id
                  type: BIGINT
              - column:
                  name: branch_id
                  type: VARCHAR(255)
              - column:
                  name: batch_id
                  type: VARCHAR(255)
               
              - column:
                  name: difficulty_level
                  type: VARCHAR(50)
                  constraints:
                    nullable: false   
              - column:
                  name: percentage
                  type: NUMERIC(5,2)
              - column:
                  name: subject
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  
    
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_subject_wise_performance_bar
            baseColumnNames: scheduled_exam_id
            constraintName: fk_seswpbm_sem
            referencedTableName: scheduled_exams
            referencedColumnNames: scheduled_exam_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_subject_wise_performance_bar
            baseColumnNames: edu_scheduled_exam_id
            constraintName: fk_seswpbm_esem
            referencedTableName: educator_scheduled_exams
            referencedColumnNames: edu_scheduled_exam_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_subject_wise_performance_bar
            baseColumnNames: tenant_id
            constraintName: fk_seswpbm_tenants
            referencedTableName: tenants
            referencedColumnNames: tenant_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_subject_wise_performance_bar
            baseColumnNames: user_id
            constraintName: fk_seswpbm_users
            referencedTableName: users
            referencedColumnNames: user_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_subject_wise_performance_bar
            baseColumnNames: educator_id
            constraintName: fk_seswpbm_educators
            referencedTableName: educators
            referencedColumnNames: educator_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_subject_wise_performance_bar
            baseColumnNames: branch_id
            constraintName: fk_seswpbm_branches
            referencedTableName: branches
            referencedColumnNames: branch_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_subject_wise_performance_bar
            baseColumnNames: batch_id
            constraintName: fk_seswpbm_batches
            referencedTableName: batches
            referencedColumnNames: batch_id

 
 