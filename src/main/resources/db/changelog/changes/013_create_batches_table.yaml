databaseChangeLog:
  - changeSet:
      id: create-batches-table
      author: brihathi
      changes:
        - createTable:
            tableName: batches
            columns:
              - column:
                  name: batch_id
                  type: VARCHAR(255)
                  # autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: branch_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: batch_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
 
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
 
        - addForeignKeyConstraint:
            baseTableName: batches
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            constraintName: fk_batches_tenant
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: batches
            baseColumnNames: branch_id
            referencedTableName: branches
            referencedColumnNames: branch_id
            constraintName: fk_batches_branches
            onDelete: CASCADE
 
 
 
 
 