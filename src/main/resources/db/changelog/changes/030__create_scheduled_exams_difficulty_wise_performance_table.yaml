databaseChangeLog:
  - changeSet:
      id: create-scheduled-exams-difficulty-wise-performance-table
      author: Brihathi
      changes:
        - createTable:
            tableName: scheduled_exams_difficulty_wise_performance
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: scheduled_exam_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: edu_scheduled_exam_id
                  type: BIGINT 
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: educator_id
                  type: BIGINT
              - column:
                  name: branch_id
                  type: VARCHAR(255)
              - column:
                  name: batch_id
                  type: VARCHAR(255)
              - column:
                  name: difficulty_level
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: percentage
                  type: INTEGER
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_difficulty_wise_performance
            baseColumnNames: user_id
            constraintName: fk_sedwpm_users
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE
            
      
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_difficulty_wise_performance
            baseColumnNames: scheduled_exam_id
            constraintName: fk_sedwpm_sem
            referencedTableName: scheduled_exams
            referencedColumnNames: scheduled_exam_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_difficulty_wise_performance
            baseColumnNames: edu_scheduled_exam_id
            constraintName: fk_sedwpm_esem
            referencedTableName: educator_scheduled_exams
            referencedColumnNames: edu_scheduled_exam_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_difficulty_wise_performance
            baseColumnNames: tenant_id
            constraintName: fk_sedwpm_tenants
            referencedTableName: tenants
            referencedColumnNames: tenant_id
        
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_difficulty_wise_performance
            baseColumnNames: educator_id
            constraintName: fk_sedwpm_educators
            referencedTableName: educators
            referencedColumnNames: educator_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_difficulty_wise_performance
            baseColumnNames: branch_id
            constraintName: fk_sedwpm_branches
            referencedTableName: branches
            referencedColumnNames: branch_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_difficulty_wise_performance
            baseColumnNames: batch_id
            constraintName: fk_sedwpm_batches
            referencedTableName: batches
            referencedColumnNames: batch_id

 
 