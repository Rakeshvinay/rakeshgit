databaseChangeLog:
  - changeSet:
      id: create-scheduled-exam-final-results
      author: brihathi
      changes:
        - createTable:
            tableName: scheduled_exam_final_results
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: scheduled_exam_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: edu_scheduled_exam_id
                  type: INTEGER
              - column:
                  name: user_id
                  type: INTEGER
              - column:
                  name: tenant_id
                  type: INTEGER
              - column:
                  name: educator_id
                  type: INTEGER
              - column:
                  name: branch_id
                  type: VARCHAR(250)
              - column:
                  name: batch_id
                  type: VARCHAR(250)
              - column:
                  name: total_time_spent
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: submitted_date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: total_marks
                  type: INTEGER
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: scheduled_exam_final_results
            baseColumnNames: scheduled_exam_id
            constraintName: fk_scheduled_exam_final_results_exam
            referencedTableName: scheduled_exams
            referencedColumnNames: scheduled_exam_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exam_final_results
            baseColumnNames: edu_scheduled_exam_id
            constraintName: fk_scheduled_exam_final_results_exam
            referencedTableName: educator_scheduled_exams
            referencedColumnNames: edu_scheduled_exam_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exam_final_results
            baseColumnNames: tenant_id
            constraintName: fk_scheduled_exam_final_results_tenants
            referencedTableName: tenants
            referencedColumnNames: tenant_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exam_final_results
            baseColumnNames: user_id
            constraintName: fk_exam_final_results_users
            referencedTableName: users
            referencedColumnNames: user_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exam_final_results
            baseColumnNames: educator_id
            constraintName: fk_scheduled_exam_final_results_educators
            referencedTableName: educators
            referencedColumnNames: educator_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exam_final_results
            baseColumnNames: branch_id
            constraintName: fk_exam_final_results_braches
            referencedTableName: braches
            referencedColumnNames: branch_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exam_final_results
            baseColumnNames: batch_id
            constraintName: fk_exam_final_results_batches
            referencedTableName: batches
            referencedColumnNames: batch_id

