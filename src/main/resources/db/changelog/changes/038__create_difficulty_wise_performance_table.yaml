databaseChangeLog:
  - changeSet:
      id: create-difficulty-wise-performance-table
      author: Brihathi
      changes:
        - createTable:
            tableName: difficulty_wise_performance
            columns:
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: exam_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: difficulty_level
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: percentage
                  type: DECIMAL(5,2)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                 
        - addForeignKeyConstraint:
            baseTableName: difficulty_wise_performance
            baseColumnNames: user_id
            constraintName: fk_difficulty_performance_user
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE
           
        -  addForeignKeyConstraint:
            baseTableName: difficulty_wise_performance
            baseColumnNames: exam_id
            constraintName: fk_cwr_exam
            referencedTableName: exams
            referencedColumnNames: exam_id
            onDelete: CASCADE
 
         -  addForeignKeyConstraint:
            baseTableName: difficulty_wise_performance
            baseColumnNames: tenant_id
            constraintName: fk_dwr_tenant
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            onDelete: CASCADE
 
 
 