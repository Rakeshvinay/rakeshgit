databaseChangeLog:
   - changeset:
      id: create-tenant_staff-table
      author: brihathi
      changes:
        - createTable:
            tableName: 003_create_tenant_staff_table
            columns:
              - column:
                  name: mid
                  type: BIGINT
                  autoIncrement: true
              - column:
                   name: tenant_id
                   type: BIGINT
                   constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(250)
              - column:
                  name: profile_image
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(250)
              - column:
                  name: department
                  type: VARCHAR(250)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
 
          -addForeignKeyConstraint:
              baseTableName: tenant_staff
              baseColumnName: tenant_id
              constraintName: fk_tenant_staff_tenants
              referencedTableName: tenants
              referencedColumnName: tenant_id