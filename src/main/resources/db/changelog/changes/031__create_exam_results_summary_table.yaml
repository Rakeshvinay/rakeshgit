databaseChangeLog:
  - changeSet:
      id: create-exam-results-summary-table
      author: brihathi
      changes:
        - createTable:
            tableName: exam_results_summary
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_exam_results_summary_user
                    references: users(user_id)
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: exam_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_exam_results_summary_exam
                    references: exams(exam_id)
              - column:
                  name: total_questions
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: total_answered
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: not_answered
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: marked_for_review
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: answered_and_marked_for_review
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: not_visited
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: corrected_count
                  type: INTEGER
              - column:
                  name: wrong_count
                  type: INTEGER
              - column:
                  name: difficulty_level
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
 
        - addForeignKeyConstraint:
            baseTableName: exam_results_summary
            baseColumnNames: tenant_id
            constraintName: fk_exam_results_sm_tenant
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            onDelete: CASCADE
 