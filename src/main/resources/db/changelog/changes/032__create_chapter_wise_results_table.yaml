

 databaseChangeLog:
  - changeSet:
      id: create-chapter-wise-results-table
      author: Brihathi
      changes:
        - createTable:
            tableName: chapter_wise_results
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: exam_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: chapter_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: chapter
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: difficulty_level
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: marks
                  type: INTEGER
              - column:
                  name: duration
                  type: INTEGER
              - column:
                  name: percentage
                  type: DECIMAL(5,2)
              - column:
                  name: summary
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                 
        - addForeignKeyConstraint:
            baseTableName: chapter_wise_results
            baseColumnNames: user_id
            constraintName: fk_cwr_user
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE
 
        - addForeignKeyConstraint:
            baseTableName: chapter_wise_results
            baseColumnNames: chapter_id
            constraintName: fk_cwr_chapter
            referencedTableName: chapters
            referencedColumnNames: chapter_id
            onDelete: CASCADE
 
        - addForeignKeyConstraint:
            baseTableName: chapter_wise_results
            baseColumnNames: tenant_id
            constraintName: fk_cwr_chapter
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            onDelete: CASCADE
 

autoincrement 