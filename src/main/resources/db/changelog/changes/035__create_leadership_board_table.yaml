databaseChangeLog:
  - changeSet:
      id: create-leadership-board-table
      author: Brihathi
      changes:
        - createTable:
            tableName: leadership_board
            columns:
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: examid
                  type: BIGINT
              - column:
                  name: total_marks
                  type: INT
        - addForeignKeyConstraint:
            baseTableName: leadership_board
            baseColumnNames: user_id
            constraintName: fk_leadership_user
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: leadership_board
            baseColumnNames: tenant_id
            constraintName: fk_leadership_tenant
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            onDelete: CASCADE
 
 
 