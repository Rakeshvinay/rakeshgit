databaseChangeLog:
  - changeSet:
      id: create-time-analysis-table
      author: Brihathi
      changes:
        - createTable:
            tableName: time_analysis
            columns:
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: subject
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: avg_time
                  type: INT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: time_analysis
            baseColumnNames: user_id
            constraintName: fk_time_analysis_user
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE
 
        - addForeignKeyConstraint:
            baseTableName: time_analysis
            baseColumnNames: tenant_id
            constraintName: fk_time_analysis_tenant
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            onDelete: CASCADE
 
 
 
 