databaseChangeLog:
  - changeSet:
      id: create-sheduled-exams-leadership-board-table
      author: Brihathi
      changes:
        - createTable:
            tableName: scheduled_exams_leadership_board
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                      - column:
                  name: scheduled_exam_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: edu_scheduled_exam_id
                  type: BIGINT 
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: educator_id
                  type: BIGINT
              - column:
                  name: branch_id
                  type: VARCHAR(255)
              - column:
                  name: batch_id
                  type: VARCHAR(255)
              - column:
                  name: total_marks
                  type: INTEGER
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_leadership_board
            baseColumnNames: user_id
            constraintName: fk_seld_user
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_leadership_board
            baseColumnNames: scheduled_exam_id
            constraintName: fk_seld_sem
            referencedTableName: scheduled_exams
            referencedColumnNames: scheduled_exam_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_leadership_board
            baseColumnNames: edu_scheduled_exam_id
            constraintName: fk_seld_esem
            referencedTableName: educator_scheduled_exams
            referencedColumnNames: edu_scheduled_exam_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_leadership_board
            baseColumnNames: tenant_id
            constraintName: fk_seld_tenants
            referencedTableName: tenants
            referencedColumnNames: tenant_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_leadership_board
            baseColumnNames: educator_id
            constraintName: fk_seld_educators
            referencedTableName: educators
            referencedColumnNames: educator_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_leadership_board
            baseColumnNames: branch_id
            constraintName: fk_seld_branches
            referencedTableName: branches
            referencedColumnNames: branch_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_leadership_board
            baseColumnNames: batch_id
            constraintName: fk_seld_batches
            referencedTableName: batches
            referencedColumnNames: batch_id

 
 