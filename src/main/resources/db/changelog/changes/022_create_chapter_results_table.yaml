databaseChangeLog:
  - changeSet:
      id: 401
      author: brihathi
      changes:
        - createTable:
            tableName: chapter_results
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: exam_final_result_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: INTEGER
              - column:
                  name: chapter_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: chapter_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: time_spent
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: percentage
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: marks
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: ai_analysis
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: total_marks
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: exam_type
                  type: VARCHAR(50)
              - column:
                  name: exam_id
                  type: BIGINT
              - column:
                  name: user_id
                  type: BIGINT
 
        - addForeignKeyConstraint:
            baseTableName: chapter_results
            baseColumnNames: exam_id
            constraintName: fk_chapter_results_exam
            referencedTableName: exam
            referencedColumnNames: exam_id
 
        - addForeignKeyConstraint:
            baseTableName: chapter_results
            baseColumnNames: user_id
            constraintName: fk_chapter_results_user
            referencedTableName: users
            referencedColumnNames: user_id
        - addForeignKeyConstraint:
            baseTableName: chapter_results
            baseColumnNames: exam_final_result_id
            constraintName: fk_chapter_results_exam_final_results
            referencedTableName: exam_final_results
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: chapter_results
            baseColumnNames: tenant_id
            constraintName: fk_chapter_results_tenants
            referencedTableName: tenants
            referencedColumnNames: tenant_id