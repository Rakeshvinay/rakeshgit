databaseChangeLog:
  - changeSet:
      id: create-scheduled-exams-score-predictor-table
      author: brihathi
      changes:
        - createTable:
            tableName: scheduled_exams_score_predictor
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
            #   - column:
            #       name: scheduled_exam_id
            #       type: BIGINT
            #       constraints:
            #         nullable: false
            #   - column:
            #       name: edu_scheduled_exam_id
            #       type: BIGINT 
            #       constraints:
            #         nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
            #   - column:
            #       name: educator_id
            #       type: BIGINT
              - column:
                  name: branch_id
                  type: VARCHAR(255)
              - column:
                  name: batch_id
                  type: VARCHAR(255)
              - column:
                  name: predicted_score
                  type: INTEGER
              - column:
                  name: no_of_exams
                  type: INTEGER
              - column:
                  name: predicted_rank
                  type: INTEGER
              - column:
                  name: percentage
                  type: DOUBLE PRECISION
              - column:
                  name: good_at
                  type: TEXT
              - column:
                  name: need_to_improve
                  type: TEXT
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
 
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_score_predictor
            baseColumnNames: user_id
            constraintName: fk_sespm_users
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_score_predictor
            baseColumnNames: scheduled_exam_id
            constraintName: fk_sespm_sched_exams
            referencedTableName: scheduled_exams
            referencedColumnNames: scheduled_exam_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_score_predictor
            baseColumnNames: edu_scheduled_exam_id
            constraintName: fk_sespm_edu_sched_exams
            referencedTableName: educator_scheduled_exams
            referencedColumnNames: edu_scheduled_exam_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_score_predictor
            baseColumnNames: tenant_id
            constraintName: fk_sespm_tenants
            referencedTableName: tenants
            referencedColumnNames: tenant_id

        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_score_predictor
            baseColumnNames: educator_id
            constraintName: fk_sespm_educators
            referencedTableName: educators
            referencedColumnNames: educator_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_score_predictor
            baseColumnNames: branch_id
            constraintName: fk_sespm_branches
            referencedTableName: branches
            referencedColumnNames: branch_id
        - addForeignKeyConstraint:
            baseTableName: scheduled_exams_score_predictor
            baseColumnNames: batch_id
            constraintName: fk_sesp_batches
            referencedTableName: batches
            referencedColumnNames: batch_id

 
 