databaseChangeLog:
  - changeSet:
      id: create-subject-wise-performance-bar-table
      author: Brihathi
      changes:
        - createTable:
            tableName: subject_wise_performance_bar
            columns:
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: exam_id
                  type: INTEGER
                  constraints:
                    nullable: false  
              - column:
                  name: difficulty_level
                  type: VARCHAR(50)
                  constraints:
                    nullable: false  
              - column:
                  name: percentage
                  type: NUMERIC(5,2)
              - column:
                  name: subject
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
 
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                 
        - addForeignKeyConstraint:
            baseTableName: subject_wise_performance_bar
            baseColumnNames: user_id
            constraintName: fk_performance_bar_user
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE
 
        - addForeignKeyConstraint:
            baseTableName: subject_wise_performance_bar
            baseColumnNames: exam_id
            constraintName: fk_exam
            referencedTableName: exams
            referencedColumnNames: exam_id
            onDelete: CASCADE
       
        - addForeignKeyConstraint:
            baseTableName: subject_wise_performance_bar
            baseColumnNames: tenant_id
            constraintName: fk_subject_wise_tenant
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            onDelete: CASCADE
 
 
 