databaseChangeLog:
  - changeSet:
      id: create-score-predictor-table
      author: brihathi
      changes:
        - createTable:
            tableName: score_predictor
            columns:
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: predicted_score
                  type: INT
              - column:
                  name: no_of_exams
                  type: INT
              - column:
                  name: predicted_rank
                  type: INT
              - column:
                  name: percentage
                  type: DOUBLE PRECISION
              - column:
                  name: good_at
                  type: TEXT
              - column:
                  name: need_to_improve
                  type: TEXT
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
 
        - addForeignKeyConstraint:
            baseTableName: score_predictor
            baseColumnNames: user_id
            constraintName: fk_user
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE
       
        - addForeignKeyConstraint:
            baseTableName: score_predictor
            baseColumnNames: tenant_id
            constraintName: fk_tenant
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            onDelete: CASCADE
       
 
 