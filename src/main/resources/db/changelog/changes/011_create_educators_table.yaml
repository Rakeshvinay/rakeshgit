databaseChangeLog:
  - changeSet:
      id: create-educators-table
      author: brihathi
      changes:
        - createTable:
            tableName: educators
            columns:
              - column:
                  name: educator_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: educator_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: phone_number
                  type: BIGINT

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: subject
                  type: VARCHAR(255)

              - column:
                  name: current_token
                  type: TEXT

              - column:
                  name: last_login
                  type: TIMESTAMP

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: educators
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            constraintName: fk_educators_tenant
            onDelete: CASCADE
